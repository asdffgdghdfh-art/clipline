name: macOS build

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Show Swift version
        run: swift --version
      - name: Run tests
        run: swift test
      - name: Build macOS app
        run: bash scripts/build_app.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent dist/ClipLine.app dist/ClipLine-macos.zip
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClipLine-macos
          path: dist/ClipLine-macos.zip
          if-no-files-found: error
